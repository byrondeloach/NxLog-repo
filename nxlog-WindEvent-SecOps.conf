define ROOT C:\Program Files (x86)\nxlog                                       

Moduledir %ROOT%\modules                                                       
CacheDir %ROOT%\data                                                           
Pidfile %ROOT%\data\nxlog.pid                                                  
SpoolDir %ROOT%\data                                                           
LogFile %ROOT%\data\nxlog.log                                                  


<Extension syslog>                                                             
      Module xm_syslog                                                               
</Extension>                                                                   

<Extension _json>
      Module      xm_json
</Extension>
 
<Input windows>
	Module	im_msvistalog
	SavePos	TRUE
	ReadFromLast	TRUE
 <QueryXML>
   <QueryList>
      <Query Id="0">
         <Select Path="Application">*</Select>
         <Select Path="System">*</Select>
         <Select Path="Security">*</Select>
      </Query>
  </QueryList>
 </QueryXML>
    Exec if ($EventID == 5156) drop();
	Exec	$Message = to_json(); 
	
</Input>

<Route r1>
      Path windows => out_chronicle_windevents
</Route>


<Output out_chronicle_windevents>
      Module      om_tcp
      Host        %WINEVTLOG_OUTPUT_DESTINATION_ADDRESS%
      Port        %WINEVTLOG_OUTPUT_DESTINATION_PORT%
      Exec        $EventTime = integer($EventTime) / 1000;
      Exec        $EventReceivedTime = integer($EventReceivedTime) / 1000;
      Exec        to_json();
</Output>

<Input in_iis>                                                                 
Module im_file                                                                 
File "C:\\inetpub\\logs\\LogFiles\\W3SVC1\\u_ex*"                              
SavePos TRUE                                                                   
ReadFromLast TRUE                                                              
Exec if $raw_event =~ /^#/ drop();                                             
Exec $Message = $raw_event;                                                    
</Input>                                                                       

<Output out_iis>                                                               
Module om_tcp                                                                  
Host 10.51.100.8                                                               
Port 11613                                                                       
Exec $SyslogFacilityValue = 2;                                                 
Exec $SourceName = 'windows_iis_logs';                                         
Exec to_syslog_bsd();                                                          
</Output>                                                                      


<Route in-to-out>                                                              
Path in_iis => out_iis                                                         
</Route>                                  
