define WINDHCP_OUTPUT_DESTINATION_ADDRESS 10.51.100.8
define WINDHCP_OUTPUT_DESTINATION_PORT 11669
                                       
<Extension _json>                                                              
  Module xm_json                                                               
</Extension>                                                                   
 
#Extension for MSSQL                                                           
<Extension mssql_csv>                                                          
    Module          xm_csv                                                     
    Fields          $Hostname, $SourceName, $Action_ID, $Result, $DataBase, $SV
_Instace, $User, $Message                                                      
    FieldTypes      string, string, string, string, string, string, string, str
ing                                                                            
    Delimiter       ;                                                          
</Extension>                                                                   
 
#Input for MSSQL                                                               
<Input in_mssql>                                                               
    Module          im_msvistalog                                              
    SavePos         FALSE                                                      
    ReadFromLast    TRUE                                                       
    Exec   $Message = $raw_event;                                              
    # Finding some values:                                                     
    Exec    if $raw_event =~ /action_id:(\S+)/ $Action_ID = $1;                
    Exec    if $raw_event =~ /database_name:(\S+)/ $DataBase = $1;             
    Exec    if $raw_event =~ /server_instance_name:(\S+)/ $SV_Instace = $1;    
    Exec    if $raw_event =~ /session_server_principal_name:(\S+)/ $User = $1; 
    Exec    if $raw_event =~ /AUDIT_SUCCESS/\                                  
              {\                                                               
                    $Result = 'Success';\                                      
              }\                                                               
              else\                                                            
                    $Result = 'Failure';                                       
    # Replace white spaces                                                     
    Exec            $Message = replace($Message, "\t", " "); $Message = replace
($Message, "\n", " "); $Message = replace($Message, "\r", " ");                
</Input>                                                                       
 
#Output for MSSQL                                                              
<Output out_mssql>                                                             
      Module          om_tcp                                                     
      Host        %WINPWRSH_OUTPUT_DESTINATION_ADDRESS%
      Port        %WINPWRSH_OUTPUT_DESTINATION_PORT%
    # Ensure we send in the proper format:                                     
      Exec           $Hostname = hostname_fqdn();                                
      Exec            mssql_csv->to_json(); $raw_event = $Hostname + ' mssql_logs:
 ' + $raw_event;                                                               
</Output>                                                                      
 
#Route for MSSQL Logs                                                          
<Route mssql>                                                                  
    Path            in_mssql => out_mssql                                      
</Route>  
